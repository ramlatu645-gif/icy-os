<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="neonGlowMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Full bleed background for maskable canvas -->
  <rect width="512" height="512" fill="#070913" />
  
  <!-- Scaled content centered within 80% safe zone -->
  <g transform="translate(256, 256) scale(0.75)">
    <rect x="-130" y="-130" width="260" height="260" rx="44" fill="none" stroke="url(#neonGlowMask)" stroke-width="8" transform="rotate(45)" filter="url(#glowMask)" opacity="0.9" />
    <rect x="-85" y="-85" width="170" height="170" rx="32" fill="url(#neonGlowMask)" transform="rotate(45)" opacity="0.15" />
    <rect x="-50" y="-50" width="100" height="100" rx="20" fill="url(#neonGlowMask)" transform="rotate(45)" />
    <circle r="18" fill="#ffffff" />
  </g>
</svg>
